services:
  db:
    image: mongo:7.0
    restart: unless-stopped
    command: mongod --bind_ip_all
    environment:
      MONGO_INITDB_DATABASE: kintech_crm
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: mongodb://db:27017
      MONGODB_NAME: kintech_crm
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-strong-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-strong-refresh-secret}
      APP_URL: https://crm.kintechagency.com
      CLIENT_URL: https://crm.kintechagency.com
      PUBLIC_STORAGE_URL: https://crm.kintechagency.com/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./server
    restart: unless-stopped
    command: ["node", "src/jobs/worker.js"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://db:27017
      MONGODB_NAME: kintech_crm
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongodata:
  uploads: