# KinTech CRM — public nginx front.
# Reverse-proxies everything to the pm2-managed production app on :8100
# (the Express server serves the built PWA + API + /uploads on one origin).
#
# NOTE: this host runs a Frappe bench whose nginx block is the default_server
# for crm.kintechagency.com's parent domain, so this block deliberately uses an
# explicit server_name (NOT default_server) and is loaded from sites-enabled.
server {
    listen 80;
    listen [::]:80;

    server_name crm.kintechagency.com;

    # Payout proof screenshots (uploads) are proxied too — keep a sane cap.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}